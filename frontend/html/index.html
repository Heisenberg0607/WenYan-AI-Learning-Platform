<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中学生文言文教学平台</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="logo">中学生文言文教学平台</div>
        <nav class="nav">
            <button class="nav-btn" data-target="punctuate">断句</button>
            <button class="nav-btn active" data-target="translate">翻译</button>
            <button class="nav-btn" data-target="search">检索</button>
            <button class="nav-btn" data-target="quiz">猜注释</button>
        </nav>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 1. 断句模块 -->
        <section id="punctuate" class="module">
            <h2>古文断句助手</h2>
            <div class="input-area">
                <textarea placeholder="请粘贴/输入无标点的文言文/诗句（例如：学而时习之不亦说乎）" id="punctuate-input"></textarea>
            </div>
            <div class="btn-group">
                <button id="punctuate-btn" class="action-btn">开始断句</button>
            </div>
            <div class="result-area" id="punctuate-result">
                <h3>断句结果</h3>
                <div class="result-content"></div>
                <button class="copy-btn">一键复制</button>
            </div>
        </section>

        <!-- 2. 翻译模块 -->
        <section id="translate" class="module active">
            <h2>古文翻译助手</h2>
            <div class="input-area">
                <textarea placeholder="请输入文言文/诗句（可带标点，例如：学而时习之，不亦说乎？）" id="translate-input"></textarea>
            </div>
            <div class="btn-group">
                <button id="translate-btn" class="action-btn">开始翻译</button>
            </div>
            <div class="result-area" id="translate-result">
                <div class="result-row">
                    <div class="result-col">
                        <h3>原文</h3>
                        <div class="result-content original"></div>
                    </div>
                    <div class="result-col">
                        <h3>释义</h3>
                        <div class="result-content translation"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. 检索模块 -->
        <section id="search" class="module">
            <h2>相似检索</h2>
            <div class="input-area">
                <input type="text" placeholder="请输入想查询的诗句（例如：明月几时有）" id="search-input">
            </div>
            <div class="btn-group">
                <button id="search-btn" class="action-btn">搜索</button>
            </div>
            <div class="result-area" id="search-result">
                <div class="poem-list"></div>
            </div>
        </section>

        <!-- 4. 猜注释模块 -->
        <section id="quiz" class="module">
            <h2>古文词语猜一猜</h2>
            <div class="quiz-question" id="quiz-question">
                <!-- 出题内容会动态渲染 -->
            </div>
            <div class="input-area">
                <input type="text" placeholder="请输入这个词语的释义" id="quiz-input">
            </div>
            <div class="btn-group">
                <button id="quiz-submit-btn" class="action-btn">提交答案</button>
                <button id="quiz-next-btn" class="action-btn" style="display: none;">再来一题</button>
            </div>
            <div class="result-area" id="quiz-result">
                <div class="score"></div>
                <div class="correct-answer"></div>
                <!-- 新增详细评分信息 -->
                 <div class="detailed-feedback">
                    <h4>详细评分</h4>
                    <div class="feedback-item">实体匹配得分: <span class="entity-score"></span></div>
                    <div class="feedback-item">关系错误扣分: <span class="penalty"></span></div>
                    <div class="feedback-item">错误关系数量: <span class="error-count"></span></div>
                    <div class="feedback-message"></div>
                </div>
                <!-- 实体比对区域 -->
                 <div class="entities-comparison">
                    <h4>实体比对</h4>
                    <div class="comparison-row">
                        <div class="comparison-col">
                            <h5>你的答案实体</h5>
                            <ul class="user-entities"></ul>
                        </div>
                        <div class="comparison-col">
                            <h5>标准答案实体</h5>
                            <ul class="correct-entities"></ul>
                        </div>
                    </div>
                </div>
                <!-- 关系比对区域 -->
                 <div class="relations-comparison">
                    <h4>关系比对</h4>
                    <div class="comparison-row">
                        <div class="comparison-col">
                            <h5>你的答案关系</h5>
                            <ul class="user-relations"></ul>
                        </div>
                        <div class="comparison-col">
                            <h5>标准答案关系</h5>
                            <ul class="correct-relations"></ul>
                        </div>
                    </div>
                    <div class="error-relations">
                        <h5>错误的关系</h5>
                        <ul></ul>
                    </div>
                </div>
                <!-- 匹配的实体对 -->
                 <div class="matched-entities">
                    <h4>匹配的实体对</h4>
                    <ul class="matched-entity-pairs"></ul>
                </div>
            </div>
        </section>
    </main>

    <!-- 加载动画 -->
    <div class="loading" id="loading">加载中...</div>
    <!-- 错误提示 -->
    <div class="toast" id="toast"></div>

    <!-- 修复模块切换：添加type="module"支持ES6导入 -->
    <script src="../js/main.js" type="module"></script>
</body>
</html>
